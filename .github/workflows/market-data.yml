name: market-data

on:
  schedule:
    - cron: "*/5 13-20 * * 1-5"   # every 5 min, 9:00 AM - 4:55 PM ET (EDT)
    - cron: "10,40 11,12 * * 1-5" # pre-market samples, 7:10 - 8:40 AM ET
    - cron: "20 12 * * 1-5"       # 8:20 AM ET scan (screeners + stats)
  workflow_dispatch:
    inputs:
      tickers:
        description: "Extra tickers, comma separated"
        required: false
        default: ""
      mode:
        description: "quotes or scan"
        required: false
        default: "quotes"

permissions:
  contents: write

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout main (ledger + scripts)
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install yfinance (screener fallback)
        run: pip install --quiet --disable-pip-version-check yfinance || true

      - name: Checkout market-data branch
        env:
          REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          if git ls-remote --exit-code --heads "$REPO_URL" market-data >/dev/null; then
            git clone --quiet --depth 1 --branch market-data "$REPO_URL" md
          else
            mkdir md && cd md && git init --quiet -b market-data && git remote add origin "$REPO_URL"
          fi

      - name: Fetch quotes
        env:
          MODE: ${{ (github.event.schedule == '20 12 * * 1-5' && 'scan') || inputs.mode || 'quotes' }}
          EXTRA: ${{ inputs.tickers || '' }}
        run: python main/scripts/marketdata.py --root main --out md --mode "$MODE" --extra "$EXTRA"

      - name: Commit data
        working-directory: md
        run: |
          git config user.name "market-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --quiet -m "data $(date -u +%Y-%m-%dT%H:%M:%SZ)" || exit 0
          for i in 1 2 3 4; do
            git push --quiet origin market-data && exit 0
            git pull --quiet --rebase origin market-data || true
            sleep $((i * 3))
          done
          exit 1
