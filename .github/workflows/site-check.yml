name: site-check

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: HTTP checks
        run: |
          curl -sS -o page.html -w "page status=%{http_code} type=%{content_type}\n" https://h1b-1k-challenge.vercel.app/
          sha1sum page.html site/index.html
          curl -sS -o /dev/null -D - -H "Origin: https://h1b-1k-challenge.vercel.app" \
            "https://raw.githubusercontent.com/vamsikrishna2421/Investment_Challenge/market-data/data/snapshot.json" \
            | grep -iE "^HTTP|access-control-allow-origin|cache-control"

      - name: Browser render
        run: |
          npm install --no-save --silent playwright@1.56.1
          npx playwright install --with-deps chromium > /dev/null 2>&1
          cat > shot.js <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch();
            for (const [name, w, scheme] of [['desktop-light', 1280, 'light'], ['phone-dark', 400, 'dark']]) {
              const p = await b.newPage({ viewport: { width: w, height: 900 }, colorScheme: scheme });
              const errs = [];
              p.on('pageerror', e => errs.push(e.message));
              p.on('console', m => { if (m.type() === 'error') errs.push(m.text()); });
              await p.goto('https://h1b-1k-challenge.vercel.app/', { waitUntil: 'networkidle' });
              await p.waitForTimeout(3000);
              const got = await p.evaluate(() => ({
                equity: document.getElementById('equity').textContent,
                profit: document.getElementById('profit').textContent,
                updated: document.getElementById('updated').textContent,
                banner: document.getElementById('banner').hidden ? '' : document.getElementById('banner').textContent,
                journal: document.querySelectorAll('.entry').length,
                overflow: document.documentElement.scrollWidth - document.documentElement.clientWidth,
              }));
              console.log(name, JSON.stringify(got), 'errors', JSON.stringify(errs));
              await p.screenshot({ path: `checks/${name}.png`, fullPage: true });
            }
            await b.close();
          })();
          JS
          mkdir -p checks
          node shot.js

      - name: Publish screenshots to the checks branch
        run: |
          cd checks
          git init -q -b checks
          git config user.name "site-check-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "site check $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" checks
